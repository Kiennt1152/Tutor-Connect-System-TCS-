spring.application.name=tcs
server.port=8080

# Multipart limits (UC-08 AF-02: avatar up to 5 MB)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Local file storage for avatar upload (UC-08 AF-02)
tcs.file.storage.path=uploads

spring.datasource.url=jdbc:mysql://localhost:3306/tutorconnectsystem?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

app.jwt.secret=TCS-Super-Secret-Key-For-JWT-Min-256-Bits-Long-2026!!
app.jwt.expiration-ms=86400000

# Email / SMTP (UC-44 M4)
# Configure these for your mail provider:
#   Gmail: smtp.gmail.com + App Password (16-char)
#   Mailgun: smtp.mailgun.org + SMTP credentials
#   Local dev: use MailHog/MailCatcher on localhost:1025
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:noreply@tcs.local}
app.mail.enabled=${MAIL_ENABLED:false}