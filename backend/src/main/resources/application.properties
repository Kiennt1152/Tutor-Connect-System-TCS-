spring.application.name=tcs
server.port=8080

# Nạp cấu hình mail bí mật từ file cục bộ (KHÔNG commit — đã thêm vào .gitignore).
# Đặt MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM trong ./secret-mail.properties.
spring.config.import=optional:file:./secret-mail.properties

# Multipart limits for profile images, payment evidence, and dispute attachments.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
tcs.file.storage.path=uploads

spring.datasource.url=jdbc:mysql://localhost:3306/tutorconnectsystem?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


# ===== JWT =====
app.jwt.secret=TCS-Super-Secret-Key-For-JWT-Min-256-Bits-Long-2026!!
app.jwt.expiration-ms=86400000

# ===== Google OAuth (Login by Google) =====
# Lay tu Google Cloud Console > Credentials > OAuth 2.0 Client ID (Web).
# Phai TRUNG voi VITE_GOOGLE_CLIENT_ID cua frontend. Co the dat qua bien moi truong GOOGLE_CLIENT_ID.
app.google.client-id=${GOOGLE_CLIENT_ID:220681798961-60jkl0iq4o0chmge94tp80v99v4ir8a9.apps.googleusercontent.com}

# ===== Gemini API (chatbot fallback khi khong tim duoc FAQ khop) =====
# Lay API key tai https://aistudio.google.com/apikey, dat qua bien moi truong GEMINI_API_KEY.
# De trong (khong dat env) thi chatbot chi dung FAQ, khong goi AI.
app.gemini.api-key=${GEMINI_API_KEY:AQ.Ab8RN6KFfMOmk-FuvJHYuVBJzvVJ-HxMEe3qZQQd66IaiAK4ag}
app.gemini.model=gemini-2.0-flash
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.timeout-ms=15000

# ===== Groq API (fallback khi Gemini bi rate limit) =====
# Lay API key tai https://console.groq.com/keys, dat qua bien moi truong GROQ_API_KEY.
ai.groq.api-key=${GROQ_API_KEY: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}
ai.groq.model=llama-3.3-70b-versatile
ai.groq.base-url=https://api.groq.com/openai/v1

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# Finance safety defaults: top-up is confirmed by SePay webhook, withdrawal is manual-review unless threshold is set.
finance.dev-direct-deposit-enabled=false
finance.dev-simulate-topup-enabled=false
finance.withdrawal.auto-approval-threshold=0

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
# Bo so checksum khi migrate: tranh loi "checksum mismatch" do line-ending (CRLF/LF)
# khac nhau giua cac may. Van ap migration moi va van bat loi trung version.
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
# Bo qua migration da ap trong DB nhung khong con file (vd. V9/V10 da xoa) -> khong chan khoi dong.
spring.flyway.ignore-migration-patterns=*:missing

# Email / SMTP (UC-44 M4)
# Configure these for your mail provider:
#   Gmail: smtp.gmail.com + App Password (16-char)
#   Mailgun: smtp.mailgun.org + SMTP credentials
#   Local dev: use MailHog/MailCatcher on localhost:1025
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP / verified-email token (UC-01: BR-UC01-04, 05, 07)
# MAIL_FROM tu dong lay theo MAIL_USERNAME neu khong dat rieng -> chi can dien
# MAIL_USERNAME + MAIL_PASSWORD la du.
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@tcs.local}}
app.mail.from-name=${MAIL_FROM_NAME:Tutor Connect System}
app.mail.enabled=true
app.otp.length=6
app.otp.expiration-minutes=5
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-per-email-per-window=5
app.otp.email-window-minutes=6
app.otp.max-per-ip-per-hour=15
app.verified-token.expiration-minutes=15
