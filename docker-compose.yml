services:
  mysql:
    image: mysql:8.0
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345}
      MYSQL_DATABASE: tutorconnectsystem
    ports:
      - "${MYSQL_PORT:-33060}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: tcs-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      CORS_ALLOWED_ORIGINS: "https://tutorconnectsystem.io.vn,http://tutorconnectsystem.io.vn,https://www.tutorconnectsystem.io.vn,http://www.tutorconnectsystem.io.vn,http://180.93.34.24,http://localhost:5173,http://localhost:3000"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tutorconnectsystem?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-12345}
      JWT_SECRET: ${JWT_SECRET}
      TCS_FILE_STORAGE_PATH: /app/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AI_CHAT_PROVIDER_ORDER: ${AI_CHAT_PROVIDER_ORDER:-groq,cerebras,deepseek,gemini}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: tcs-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
